<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BatchSizeTest</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<canvas id="diagram" style="width:100%"></canvas>
<form id="start-test-form" method="POST" action="/speedTest/start">
    <div class="container">
        <div>
            <button class="btn btn-success" id="start-test">Start test</button>
        </div>
    </div>
</form>
</body>
<script>
    const xValues = [0, 10000];

    const batchSizeFindByIdIn = {
        label: "BatchSize (FindByIdIn)",
        data: [0],
        borderColor: "Aqua",
        fill: false
    }

    const entityGraphFindByIdIn = {
        label: "EntityGraph (FindByIdIn)",
        data: [0],
        borderColor: "Brown",
        fill: false
    }

    const batchSizeFindAll = {
        label: "BatchSize (FindAll)",
        data: [0],
        borderColor: "Red",
        fill: false
    }

    const entityGraphFindAll = {
        label: "EntityGraph (FindAll)",
        data: [0],
        borderColor: "Cyan",
        fill: false
    }

    var chart = new Chart("diagram", {
        type: "line",
        data: {
            labels: xValues,
            datasets: [
                batchSizeFindByIdIn,
                entityGraphFindByIdIn,
                batchSizeFindAll,
                entityGraphFindAll
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'right'
                },
                title: {
                    display: true,
                    text: 'Entity requests comparison',
                    font: {
                        size: 20
                    }
                },
            },
            scales: {
                x: {
                    display: true,
                    title: {
                        display: true,
                        text: 'Entity count',
                        font: {
                            size: 20
                        }
                    }
                },
                y: {
                    display: true,
                    title: {
                        display: true,
                        text: 'Request time (ms)',
                        font: {
                            size: 20
                        }
                    }
                }
            }
        }
    });

    document.querySelector("#start-test-form").addEventListener("submit", (event) => {
        event.preventDefault();
        clearDiagram()
        fetch(event.target.action, {
            method: "POST"
        }).then(res => alert('Finished'));
    })

    const stompClient = new StompJs.Client({
        brokerURL: 'ws://localhost:8080/speedTest'
    });

    stompClient.onConnect = (frame) => {
        console.log('Connected: ' + frame);
        stompClient.subscribe('/topic/diagramUpdate', (diagramUpdateMessage) => {
            updateDiagram(JSON.parse(diagramUpdateMessage.body));
        });
    };

    stompClient.activate();

    function updateDiagram(diagramUpdate) {
        console.log(diagramUpdate)
        batchSizeFindByIdIn.data.push(diagramUpdate.processBatchSizeFindByIdInStats?.requestTime)
        entityGraphFindByIdIn.data.push(diagramUpdate.processEntityGraphFindByIdInStats?.requestTime)
        entityGraphFindAll.data.push(diagramUpdate.processEntityGraphFindAllStats?.requestTime)
        batchSizeFindAll.data.push(diagramUpdate.processBatchSizeFindAllStats?.requestTime)
        chart.update();
    }

    function clearDiagram() {
        chart.data.datasets.forEach(dataset => dataset.data = [0])
        chart.update();
    }
</script>
</html>
